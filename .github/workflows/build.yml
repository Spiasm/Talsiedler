name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Talsiedler.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Talsiedler – Version ${{ github.run_number }}
          body: "Zum Installieren unten auf **Talsiedler.apk** tippen."
          files: Talsiedler.apk
          make_latest: true

      - name: Fehlerprotokoll veröffentlichen
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fehler-${{ github.run_number }}
          name: Fehler ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: build.log
